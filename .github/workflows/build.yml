name: Build and publish image

on:
  # changes to the Dockerfile / workflow in this repository
  push:
    branches: [main]
  pull_request:
  # daily check for a new pangeo-notebook release or a new pangeo-fish commit
  schedule:
    - cron: "0 4 * * *"
  # sent by pangeo-fish on main pushes and published releases
  # (see extras/notify-docker-image.yml)
  repository_dispatch:
    types: [pangeo-fish-updated]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if an image for these versions already exists"
        type: boolean
        default: false
      pangeo_notebook_tag:
        description: "pangeo/pangeo-notebook tag (empty = latest release)"
        required: false
        default: ""
      pangeo_fish_ref:
        description: "pangeo-fish branch, tag or commit (empty = main)"
        required: false
        default: ""

concurrency:
  # Keep distinct releases out of the replaceable pending main-build queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event.client_payload.release_tag && format('release-{0}', github.event.client_payload.release_tag) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pangeo-fish-notebook
  PANGEO_FISH_REPO: https://github.com/pangeo-fish/pangeo-fish.git

jobs:
  check-workflow:
    name: Test image workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v

  resolve:
    name: Resolve versions
    needs: check-workflow
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      notebook_tag: ${{ steps.versions.outputs.notebook_tag }}
      fish_sha: ${{ steps.versions.outputs.fish_sha }}
      image_tag: ${{ steps.versions.outputs.image_tag }}
      is_default: ${{ steps.versions.outputs.is_default }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pangeo-notebook tag and pangeo-fish commit
        id: versions
        env:
          INPUT_NOTEBOOK_TAG: ${{ inputs.pangeo_notebook_tag }}
          INPUT_FISH_REF: ${{ inputs.pangeo_fish_ref }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: python3 scripts/image_workflow.py resolve

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image already exists
        id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
        run: |
          # Always build for code changes in this repo or when forced;
          # for scheduled / dispatched runs, only build when something changed.
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ] || [ "$FORCE" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "$IMAGE:$IMAGE_TAG already exists, nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.resolve.outputs.image_tag }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NOTEBOOK_TAG: ${{ needs.resolve.outputs.notebook_tag }}
      FISH_SHA: ${{ needs.resolve.outputs.fish_sha }}
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
    steps:
      # pangeo-notebook + torch is too large for the default runner disk
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg PANGEO_NOTEBOOK_TAG="$NOTEBOOK_TAG" \
            --build-arg PANGEO_FISH_REF="$FISH_SHA" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label io.github.pangeo-fish.pangeo-fish-commit="$FISH_SHA" \
            --tag "$IMAGE:$IMAGE_TAG" \
            .

      # pangeo_fish.helpers imports most of the package (hmm.prediction, io, ...)
      # and its third-party dependencies at module level, so importing it catches
      # dependencies missing from pyproject.toml, not just a broken install.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint "" "$IMAGE:$IMAGE_TAG" \
            /srv/conda/envs/pangeo-fish/bin/python -c "import importlib.metadata as m, pangeo_fish, pangeo_fish.helpers; print(pangeo_fish.__file__, m.version('pangeo-fish'))"
          docker run --rm --entrypoint "" "$IMAGE:$IMAGE_TAG" \
            jupyter kernelspec list | tee /dev/stderr | grep -q pangeo-fish

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          echo "- \`$IMAGE:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image aliases
    needs: [resolve, build]
    # An existing tested image can receive a release tag without rebuilding.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
      FISH_SHA: ${{ needs.resolve.outputs.fish_sha }}
      IS_DEFAULT: ${{ needs.resolve.outputs.is_default }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest or release tag
        id: aliases
        run: python3 scripts/image_workflow.py publish

      # Preserve the optional Docker Hub mirror, including release aliases.
      - name: Log in to Docker Hub
        if: >-
          vars.DOCKERHUB_IMAGE != '' &&
          (needs.build.result == 'success' || steps.aliases.outputs.changed == 'true')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Mirror image and aliases to Docker Hub
        if: >-
          vars.DOCKERHUB_IMAGE != '' &&
          (needs.build.result == 'success' || steps.aliases.outputs.changed == 'true')
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          ALIASES: ${{ steps.aliases.outputs.aliases }}
        run: |
          docker pull "$IMAGE:$IMAGE_TAG"
          tags=("$IMAGE_TAG")
          while IFS= read -r alias; do
            tags+=("$alias")
          done < <(jq -r '.[]' <<< "$ALIASES")
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE:$IMAGE_TAG" "$DOCKERHUB_IMAGE:$tag"
            docker push "$DOCKERHUB_IMAGE:$tag"
            echo "- \`docker.io/$DOCKERHUB_IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
